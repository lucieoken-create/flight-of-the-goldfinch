<!-- @dsCard group="Components" name="Progress thread" -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--night:#14100c;--shadow:#4c4032;--umber:#645c4f;--feather:#a0917a;--plaster-mid:#c8bead;--plaster:#d8d0bf;--gold-deep:#986111;--gilt:#c9a24b;--red-wax:#70453c;--canal-blue:#33445f;
--font-quote:'EB Garamond',Georgia,serif;--font-ui:'Source Serif 4',Georgia,serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--night);color:var(--plaster);font-family:var(--font-ui);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 32px;position:relative}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%)}
.attr{font-family:var(--font-ui);font-weight:600;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--feather)}
.tag{font-family:var(--font-ui);font-weight:600;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gilt)}

.thread{position:relative;height:420px;width:2px}
.thread::before{content:"";position:absolute;inset:0;background:var(--shadow)}
.thread::after{content:"";position:absolute;top:0;left:0;width:2px;height:46%;background:var(--gilt)}
.stop{position:absolute;left:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;border:1px solid var(--umber);background:var(--night);z-index:1}
.stop.done{border-color:var(--gilt);background:var(--gold-deep)}
.bird{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:var(--gilt);box-shadow:0 0 14px rgba(201,162,75,.55);z-index:2}
.lbl{position:absolute;left:18px;transform:translateY(-50%);font-family:var(--font-ui);font-weight:600;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--umber);white-space:nowrap}
.lbl.on{color:var(--feather)}

</style></head><body><div class="thread">
<span class="stop done" style="top:2%"></span><span class="lbl on" style="top:2%">painting</span>
<span class="stop done" style="top:21%"></span><span class="lbl on" style="top:21%">the met</span>
<span class="stop done" style="top:40%"></span><span class="lbl on" style="top:40%">the shop</span>
<span class="bird"></span>
<span class="stop" style="top:60%"></span><span class="lbl" style="top:60%">vegas</span>
<span class="stop" style="top:79%"></span><span class="lbl" style="top:79%">amsterdam</span>
<span class="stop" style="top:98%"></span><span class="lbl" style="top:98%">return</span>
</div></body></html>
