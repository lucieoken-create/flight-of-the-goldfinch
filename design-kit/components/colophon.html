<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--night:#14100c;--shadow:#4c4032;--umber:#645c4f;--feather:#a0917a;--plaster-mid:#c8bead;--plaster:#d8d0bf;--gold-deep:#986111;--gilt:#c9a24b;--red-wax:#70453c;--canal-blue:#33445f;
--font-quote:'EB Garamond',Georgia,serif;--font-ui:'Source Serif 4',Georgia,serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--night);color:var(--plaster);font-family:var(--font-ui);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 32px;position:relative}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%)}
.attr{font-family:var(--font-ui);font-weight:600;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--feather)}
.tag{font-family:var(--font-ui);font-weight:600;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gilt)}

.col{max-width:52ch;display:flex;flex-direction:column;gap:14px;text-align:center}
.h{font-family:var(--font-quote);font-style:italic;font-size:22px}
.t{font-size:12.5px;line-height:1.9;color:var(--feather)}
.t a{color:var(--gilt);text-decoration:none;border-bottom:1px dotted var(--gilt)}

</style></head><body><div class="col">
<p class="h">after The Goldfinch</p>
<p class="t">Quotes from <em>The Goldfinch</em> by Donna Tartt (Little, Brown, 2013).<br>
<em>The Goldfinch</em>, Carel Fabritius, 1654 · Mauritshuis, The Hague.<br>
Gallery: Bosschaert (Mauritshuis) · Burton (National Gallery of Ireland) · O'Keeffe ×2 · Monet.<br>
Built with Lenis and GSAP · hijinx</p>
</div></body></html>
