<!-- @dsCard group="Foundations" name="Palette" -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--night:#14100c;--shadow:#4c4032;--umber:#645c4f;--feather:#a0917a;--plaster-mid:#c8bead;--plaster:#d8d0bf;--gold-deep:#986111;--gilt:#c9a24b;--red-wax:#70453c;--canal-blue:#33445f;
--font-quote:'EB Garamond',Georgia,serif;--font-ui:'Source Serif 4',Georgia,serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--night);color:var(--plaster);font-family:var(--font-ui);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 32px;position:relative}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%)}
.attr{font-family:var(--font-ui);font-weight:600;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--feather)}
.tag{font-family:var(--font-ui);font-weight:600;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gilt)}

.row{display:flex;gap:10px;flex-wrap:wrap;max-width:760px}
.sw{width:128px;border:1px solid var(--shadow)}
.sw div:first-child{height:64px}
.sw div:last-child{padding:8px 10px;font-size:11px;line-height:1.5;color:var(--plaster-mid)}
.sw span{color:var(--feather);font-size:10px;display:block}

</style></head><body><div class="row">
<div class="sw"><div style="background:#14100c;border-bottom:1px solid var(--shadow)"></div><div>night<span>#14100c · ground</span></div></div>
<div class="sw"><div style="background:#4c4032"></div><div>panel shadow<span>#4c4032</span></div></div>
<div class="sw"><div style="background:#645c4f"></div><div>umber<span>#645c4f · muted UI</span></div></div>
<div class="sw"><div style="background:#a0917a"></div><div>feather<span>#a0917a · 2nd text</span></div></div>
<div class="sw"><div style="background:#c8bead"></div><div>plaster mid<span>#c8bead</span></div></div>
<div class="sw"><div style="background:#d8d0bf"></div><div>plaster<span>#d8d0bf · text</span></div></div>
<div class="sw"><div style="background:#986111"></div><div>wing-bar gold<span>#986111 · sampled</span></div></div>
<div class="sw"><div style="background:#c9a24b"></div><div>gilt<span>#c9a24b · accents</span></div></div>
<div class="sw"><div style="background:#70453c"></div><div>sealing-wax red<span>#70453c · chain only</span></div></div>
<div class="sw"><div style="background:#33445f"></div><div>canal blue<span>#33445f · scene 04</span></div></div>
</div></body></html>
